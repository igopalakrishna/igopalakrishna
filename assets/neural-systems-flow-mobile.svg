<svg width="390" height="420" viewBox="0 0 390 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" preserveAspectRatio="xMidYMid meet">
  <title id="title">Data and AI systems flow</title>
  <desc id="description">A mobile system diagram showing ingestion, transformation, models and retrieval, ranking, and serving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="flow" x1="195" y1="28" x2="195" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      .label { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1.5px; fill: #BAE6FD; }
      .sub { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .6px; fill: #94A3B8; }
      .node { fill: #0F1D34; stroke: #38BDF8; stroke-opacity: .6; }
    </style>
  </defs>
  <rect width="390" height="420" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="388" height="418" rx="19" stroke="#38BDF8" stroke-opacity=".2"/>
  <path d="M195 72V348" stroke="url(#flow)" stroke-width="2" stroke-dasharray="5 8"/>

  <g>
    <rect class="node" x="45" y="22" width="300" height="58" rx="13"/>
    <text class="label" x="195" y="48" text-anchor="middle">INGEST</text>
    <text class="sub" x="195" y="68" text-anchor="middle">batch · stream</text>
  </g>
  <path d="M189 88L195 96L201 88" stroke="#38BDF8" stroke-width="2"/>
  <g>
    <rect class="node" x="45" y="100" width="300" height="58" rx="13"/>
    <text class="label" x="195" y="126" text-anchor="middle">TRANSFORM</text>
    <text class="sub" x="195" y="146" text-anchor="middle">quality · features</text>
  </g>
  <path d="M189 166L195 174L201 166" stroke="#60A5FA" stroke-width="2"/>
  <g>
    <rect class="node" x="45" y="178" width="300" height="58" rx="13"/>
    <text class="label" x="195" y="204" text-anchor="middle">MODELS · RETRIEVAL</text>
    <text class="sub" x="195" y="224" text-anchor="middle">semantic · lexical</text>
  </g>
  <path d="M189 244L195 252L201 244" stroke="#60A5FA" stroke-width="2"/>
  <g>
    <rect class="node" x="45" y="256" width="300" height="58" rx="13"/>
    <text class="label" x="195" y="282" text-anchor="middle">RANK</text>
    <text class="sub" x="195" y="302" text-anchor="middle">evaluate · select</text>
  </g>
  <path d="M189 322L195 330L201 322" stroke="#A78BFA" stroke-width="2"/>
  <g>
    <rect class="node" x="45" y="334" width="300" height="58" rx="13"/>
    <text class="label" x="195" y="360" text-anchor="middle">SERVE</text>
    <text class="sub" x="195" y="380" text-anchor="middle">APIs · products</text>
  </g>
</svg>
